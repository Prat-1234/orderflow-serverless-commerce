AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: OrderFlow - Step 1 core data and API

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: orderflow-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: customerId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: customerId-index
          KeySchema:
            - AttributeName: customerId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/orders/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
          STATE_MACHINE_ARN: !Ref CheckoutStateMachine
      Policies:
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt CheckoutStateMachine.Name
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
      Events:
        CreateOrder:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersApi
            Path: /orders
            Method: post
        GetOrder:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersApi
            Path: /orders/{orderId}
            Method: get

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: orderflow-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  OrdersApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: orderflow-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora access (no inbound rules yet)
      VpcId: !Ref Vpc

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: OrderFlow private subnets
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    Properties:
      Engine: aurora-postgresql
      EngineVersion: "16.9"
      DatabaseName: orderflow
      MasterUsername: orderflow_admin
      ManageMasterUserPassword: true
      EnableHttpEndpoint: true
      StorageEncrypted: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DbSecurityGroup
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0
        MaxCapacity: 1
        SecondsUntilAutoPause: 300

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql

  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: orderflow-inventory
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sku
          AttributeType: S
      KeySchema:
        - AttributeName: sku
          KeyType: HASH

  ReserveFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/checkout/
      Handler: app.reserve
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
          INVENTORY_TABLE: !Ref InventoryTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable

  ChargeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/checkout/
      Handler: app.charge
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
          INVENTORY_TABLE: !Ref InventoryTable

  ConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/checkout/
      Handler: app.confirm
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
          INVENTORY_TABLE: !Ref InventoryTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable

  FailFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/checkout/
      Handler: app.fail
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
          INVENTORY_TABLE: !Ref InventoryTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InventoryTable

  CheckoutStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: orderflow-checkout
      DefinitionUri: statemachine/checkout.asl.json
      DefinitionSubstitutions:
        ReserveArn: !GetAtt ReserveFunction.Arn
        ChargeArn: !GetAtt ChargeFunction.Arn
        ConfirmArn: !GetAtt ConfirmFunction.Arn
        FailArn: !GetAtt FailFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ReserveFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ChargeFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ConfirmFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref FailFunction
  OrderEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: orderflow-events

  OrderEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: orderflow-order-events

  OrderEventsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref OrderEventsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OrderEventsTopic

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: orderflow-dlq
      MessageRetentionPeriod: 1209600

  FulfillmentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: orderflow-fulfillment
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  NotificationsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: orderflow-notifications
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  AnalyticsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: orderflow-analytics
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  QueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref FulfillmentQueue
        - !Ref NotificationsQueue
        - !Ref AnalyticsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: '*'
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OrderEventsTopic

  FulfillmentSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt FulfillmentQueue.Arn
      FilterPolicyScope: MessageBody
      FilterPolicy:
        detail:
          status:
            - CONFIRMED

  NotificationsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt NotificationsQueue.Arn

  AnalyticsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt AnalyticsQueue.Arn

  OrderStatusRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref OrderEventBus
      EventPattern:
        source:
          - orderflow.orders
        detail-type:
          - OrderStatusChanged
      Targets:
        - Id: publish-to-sns
          Arn: !Ref OrderEventsTopic

  PipeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: orderflow-pipe-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: !GetAtt OrdersTable.StreamArn
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt OrderEventBus.Arn

  OrderStreamPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: orderflow-order-status-pipe
      RoleArn: !GetAtt PipeRole.Arn
      Source: !GetAtt OrdersTable.StreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 1
        FilterCriteria:
          Filters:
            - Pattern: '{"eventName":["MODIFY"],"dynamodb":{"NewImage":{"status":{"S":["CONFIRMED","FAILED"]}}}}'
      Target: !GetAtt OrderEventBus.Arn
      TargetParameters:
        EventBridgeEventBusParameters:
          DetailType: OrderStatusChanged
          Source: orderflow.orders
        InputTemplate: '{"orderId": "<$.dynamodb.NewImage.orderId.S>", "status": "<$.dynamodb.NewImage.status.S>", "customerId": "<$.dynamodb.NewImage.customerId.S>"}'
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ReportsRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: orderflow-reports
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: orderflow-cluster

  ReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /orderflow/reports
      RetentionInDays: 7

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate tasks (outbound only)
      VpcId: !Ref Vpc

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ReportTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: orderflow-report-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource: !GetAtt OrdersTable.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${ReportsBucket.Arn}/*"

  ReportTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: orderflow-report
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ReportTaskRole.Arn
      ContainerDefinitions:
        - Name: report
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/orderflow-reports:latest"
          Essential: true
          Environment:
            - Name: ORDERS_TABLE
              Value: !Ref OrdersTable
            - Name: REPORT_BUCKET
              Value: !Ref ReportsBucket
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ReportLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: report
  BatchComputeEnv:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: orderflow-fargate-ce
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: FARGATE
        MaxvCpus: 2
        Subnets:
          - !Ref PublicSubnetA
          - !Ref PublicSubnetB
        SecurityGroupIds:
          - !Ref TaskSecurityGroup

  BatchJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: orderflow-queue
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BatchComputeEnv

  ReconcileJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: orderflow-reconcile
      Type: container
      PlatformCapabilities:
        - FARGATE
      Timeout:
        AttemptDurationSeconds: 300
      RetryStrategy:
        Attempts: 1
      ContainerProperties:
        Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/orderflow-reports:latest"
        Command:
          - python
          - reconcile.py
        ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
        JobRoleArn: !GetAtt ReportTaskRole.Arn
        NetworkConfiguration:
          AssignPublicIp: ENABLED
        ResourceRequirements:
          - Type: VCPU
            Value: '0.25'
          - Type: MEMORY
            Value: '512'
        Environment:
          - Name: ORDERS_TABLE
            Value: !Ref OrdersTable
          - Name: STALE_MINUTES
            Value: '60'
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref ReportLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: reconcile
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: orderflow-alerts
      Subscription:
        - Protocol: email
          Endpoint: prateek.cloudsec@gmail.com

  DlqNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: orderflow-dlq-not-empty
      AlarmDescription: A message failed processing 3 times and landed in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  CheckoutFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: orderflow-checkout-failure-spike
      AlarmDescription: 5 or more checkout workflows failed within 5 minutes
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref CheckoutStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  OrdersErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: orderflow-orders-lambda-errors
      AlarmDescription: The orders API function threw an error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref OrdersFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  ConfirmErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: orderflow-confirm-lambda-errors
      AlarmDescription: The confirm step threw an error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ConfirmFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  FailErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: orderflow-fail-lambda-errors
      AlarmDescription: The rollback step threw an error, so stock may not have been released
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FailFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  OrderFlowDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: orderflow
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Checkout workflow executions","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/States","ExecutionsStarted","StateMachineArn","${CheckoutStateMachine}"],[".","ExecutionsSucceeded",".","."],[".","ExecutionsFailed",".","."]]}},
            {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Dead-letter queue depth","region":"${AWS::Region}","stat":"Maximum","period":60,"metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${DeadLetterQueue.QueueName}"]]}},
            {"type":"metric","x":0,"y":6,"width":24,"height":6,"properties":{"title":"Lambda errors (orders, confirm, fail)","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/Lambda","Errors","FunctionName","${OrdersFunction}"],["AWS/Lambda","Errors","FunctionName","${ConfirmFunction}"],["AWS/Lambda","Errors","FunctionName","${FailFunction}"]]}}
          ]
        }
Outputs:
  ApiUrl:
    Value: !Sub "https://${OrdersApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  AuroraClusterArn:
    Value: !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}"
  AuroraSecretArn:
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn

  CheckoutStateMachineArn:
    Value: !Ref CheckoutStateMachine

  FulfillmentQueueUrl:
    Value: !Ref FulfillmentQueue
  NotificationsQueueUrl:
    Value: !Ref NotificationsQueue
  AnalyticsQueueUrl:
    Value: !Ref AnalyticsQueue
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue

  ReportsBucketName:
    Value: !Ref ReportsBucket
  ReportsRepoUri:
    Value: !GetAtt ReportsRepo.RepositoryUri
  PublicSubnetAId:
    Value: !Ref PublicSubnetA
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup

  BatchJobQueueName:
    Value: !Ref BatchJobQueue

  FrontendUrl:
    Value: !GetAtt FrontendBucket.WebsiteURL
  FrontendBucketName:
    Value: !Ref FrontendBucket

  AlertsTopicArn:
    Value: !Ref AlertsTopic
